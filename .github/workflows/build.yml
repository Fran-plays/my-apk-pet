name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o petmorph-final.zip
          if [ -d "petmorph-final" ]; then
            mv petmorph-final/*. || true
            rm -rf petmorph-final
          fi
          rm -f petmorph-final.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          chmod +x gradlew || true
          if [ -f./gradlew ]; then
           ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetMorph-APK
          path: app/build/outputs/apk/debug/*.apk
