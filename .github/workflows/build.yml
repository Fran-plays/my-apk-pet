name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o petmorph-final.zip
          cp -r petmorph-final/*. || true
          cp -r petmorph-final/.*. 2>/dev/null || true
          rm -rf petmorph-final petmorph-final.zip
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: |
          chmod +x gradlew
         ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PetMorph-APK
          path: app/build/outputs/apk/debug/*.apk
